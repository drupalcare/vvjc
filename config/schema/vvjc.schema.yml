views.style.views_vvjc:
  type: views_style
  label: 'Views Vanilla JavaScript 3D Carousel'
  mapping:
    max_width:
      type: string
      label: 'Maximum width for carousel items'
    time_in_seconds:
      type: string
      label: 'Auto-rotate interval in milliseconds'
    large_screen_height:
      type: string
      label: 'Height on large screens'
    small_screen_height:
      type: string
      label: 'Height on small screens'
    available_breakpoints:
      type: string
      label: 'Responsive breakpoint'
    perspective:
      type: integer
      label: '3D perspective depth in pixels'
    unique_id:
      type: integer
      label: 'Unique identifier for carousel instance'
    background_color:
      type: string
      label: 'Background color in hex format'
    background_color_opacity:
      type: float
      label: 'Background color opacity'
    disable_background:
      type: boolean
      label: 'Disable background color'
    enable_deeplink:
      type: boolean
      label: 'Enable deep linking'
    deeplink_identifier:
      type: string
      label: 'Deep link URL identifier'
      constraints:
        Regex:
          pattern: '/^[a-z][a-z0-9-]*[a-z0-9]$/'
          message: 'Must start with letter, contain only lowercase letters, numbers, and hyphens'
        Length:
          max: 20
    show_navigation_arrows:
      type: boolean
      label: 'Show navigation arrows'
    show_play_pause:
      type: boolean
      label: 'Show play/pause button'
    show_slide_counter:
      type: boolean
      label: 'Show slide counter'
    show_progress_bar:
      type: boolean
      label: 'Show progress bar'
    show_dots_navigation:
      type: boolean
      label: 'Show dots navigation'
    enable_keyboard_nav:
      type: boolean
      label: 'Enable keyboard navigation'
    enable_touch_swipe:
      type: boolean
      label: 'Enable touch/swipe gestures'
    enable_pause_on_hover:
      type: boolean
      label: 'Pause on hover'
    enable_screen_reader:
      type: boolean
      label: 'Enable screen reader announcements'
    pause_on_reduced_motion:
      type: boolean
      label: 'Respect reduced motion preference'
    scrollable_dots_width:
      type: integer
      label: 'Scrollable dots navigation width in pixels'
      constraints:
        Range:
          min: 0
          max: 700

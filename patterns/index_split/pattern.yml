label: 'Index split'
description: 'A big counter and a numbered index on the left, a ring of text cards on the right; no autoplay.'
weight: 2
stage: boxed
ground: light
placement: inner-padding
serves: [associations, university, corporate]
options:
  carousel_style: ring
  max_width: '600'
  large_screen_height: '550'
  small_screen_height: '500'
  perspective: 0
  time_in_seconds: '0'
  enable_pause_on_hover: true
  enable_touch_swipe: true
  enable_keyboard_nav: true
  show_navigation_arrows: true
  show_play_pause: false
  show_slide_counter: true
  show_progress_bar: false
  show_dots_navigation: true
  scrollable_dots_width: 0
  enable_screen_reader: true
  pause_on_reduced_motion: true
  background_color: '#ffffff'
  background_color_opacity: 0.7
  disable_background: true
  available_breakpoints: '768'
  enable_deeplink: false
features: []
pictures:
  vvj_image:
    style: vvj_landscape_1200
    responsive: false
needs:
  - 'Fields in this order: the image (vvj_image, class vvj-media), kicker (vvj_kicker), title, summary (vvj_summary) and link (vvj_link).'
  - 'Give the field elements the classes vvj-media, vvj-kicker, vvj-title, vvj-summary and vvj-link.'
  - 'Show the image with the image style vvj_landscape_1200.'

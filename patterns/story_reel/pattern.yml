label: 'Story reel'
description: 'A coverflow fan of tall photo cards, story bars on top that fill with time, and pill buttons below.'
weight: 0
stage: open
ground: light
placement: inner-padding
serves: [nonprofit, publication, creative]
options:
  carousel_style: coverflow
  max_width: '1000'
  large_screen_height: '550'
  small_screen_height: '450'
  perspective: 0
  time_in_seconds: '6000'
  enable_pause_on_hover: true
  enable_touch_swipe: true
  enable_keyboard_nav: true
  show_navigation_arrows: true
  show_play_pause: true
  show_slide_counter: false
  show_progress_bar: false
  show_dots_navigation: true
  scrollable_dots_width: 0
  enable_screen_reader: true
  pause_on_reduced_motion: true
  background_color: '#ffffff'
  background_color_opacity: 0.7
  disable_background: true
  available_breakpoints: '768'
  enable_deeplink: false
features: []
pictures:
  vvj_image:
    style: vvj_square_800
    responsive: false
needs:
  - 'Fields in this order: the image (vvj_image, class vvj-media), kicker (vvj_kicker, class vvj-kicker) and title (class vvj-title).'
  - 'Show the image with the image style vvj_square_800; dark images read best.'

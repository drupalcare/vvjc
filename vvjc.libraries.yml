# Patterns. The weights put them after the breakpoint (202) and coverflow
# (201) files, so a Pattern rule wins over the module rule it restyles.
vvjc-pattern-base:
  css:
    theme:
      patterns/vvjc-pattern-base.css: { weight: 205 }
  dependencies:
    - vvjc/vvjc
    - vvj_patterns/base

